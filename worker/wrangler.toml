# Cloudflare Worker config for Ynhetrack. No secrets in here:
# API_TOKEN (and later CLAUDE_API_KEY, RESEND_API_KEY) are set with `wrangler secret put`
# and, for local dev, in the gitignored worker/.dev.vars file.
name = "ynhetrack"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Comma-separated list of browser origins allowed to call the API (CORS).
ALLOWED_ORIGINS = "https://ynagak27.github.io,http://localhost:8000,http://127.0.0.1:8000"

[[d1_databases]]
binding = "DB"
database_name = "ynhetrack"
# Created with `npx wrangler d1 create ynhetrack` (see SETUP.md). Not a secret.
database_id = "e57a1193-194e-4697-b51d-70dbb559472b"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# Second person ("partner"): the same code deployed as a separate Worker
# (ynhetrack-partner) with its own D1 database and its own API_TOKEN secret.
# Vars and bindings are not inherited by environments, so they are repeated here.
# Commands: npm run db:migrate:partner, npm run deploy:partner,
#           npx wrangler secret put API_TOKEN --env partner
[env.partner]
name = "ynhetrack-partner"

[env.partner.vars]
ALLOWED_ORIGINS = "https://ynagak27.github.io,http://localhost:8000,http://127.0.0.1:8000"

[[env.partner.d1_databases]]
binding = "DB"
database_name = "ynhetrack-partner"
# Created with `npx wrangler d1 create ynhetrack-partner`. Not a secret.
database_id = "c83ce7f4-1717-4bc1-93ae-9bc44b843ced"
migrations_dir = "migrations"
